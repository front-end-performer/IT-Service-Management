
swagger: '2.0'

info:
  version: 1.0.0
  title: IT Service Appointment API
  description: >
    REST API for managing IT service providers, IT services,
    appointment suggestions, and customer appointments.
    Customer numbers from the legacy system are supported.

host: 127.0.0.1
basePath: /
schemes:
  - http

consumes:
  - application/json
produces:
  - application/json

tags:
  - name: it-services
    description: IT-Service-Anbieter und ihre Kapazitäten
  - name: services
    description: Angebotene IT-Dienstleistungen
  - name: appointments
    description: Kundentermine
  - name: appointment-suggestions
    description: Verfügbare Terminvorschläge
  - name: appointment-imports
    description: >
      CSV-Import von Bestandsterminen aus dem Altsystem.
      Erweiterung gegenüber der ursprünglichen Spezifikation (siehe docs/adr/0006-api-deviations.md).

paths:
  /it-services:
    get:
      tags:
        - it-services
      summary: Alle IT-Service-Anbieter abrufen
      operationId: getITServices
      responses:
        '200':
          description: Liste aller IT-Service-Anbieter
          schema:
            type: array
            items:
              $ref: '#/definitions/itService'

  /it-services/{serviceId}:
    get:
      tags:
        - it-services
      summary: Details eines IT-Service-Anbieters abrufen
      operationId: getITService
      parameters:
        - $ref: '#/parameters/serviceId'
      responses:
        '200':
          description: IT-Service-Anbieter gefunden
          schema:
            $ref: '#/definitions/itService'
        '404':
          description: IT-Service-Anbieter nicht gefunden

  /it-services/{serviceId}/services:
    get:
      tags:
        - services
      summary: Dienstleistungen eines IT-Service-Anbieters abrufen
      operationId: getRepairServices
      parameters:
        - $ref: '#/parameters/serviceId'
      responses:
        '200':
          description: Liste der angebotenen Dienstleistungen
          schema:
            type: array
            items:
              $ref: '#/definitions/repairService'
        '404':
          description: IT-Service-Anbieter nicht gefunden

  /it-services/{serviceId}/appointments:
    get:
      tags:
        - appointments
      summary: Kundentermine eines IT-Service-Anbieters abrufen
      operationId: getAppointments
      parameters:
        - $ref: '#/parameters/serviceId'
        - name: from
          in: query
          description: Beginn des Abfragezeitraums inklusive (ISO 8601)
          required: false
          type: string
          format: date-time
        - name: to
          in: query
          description: Ende des Abfragezeitraums inklusive (ISO 8601)
          required: false
          type: string
          format: date-time
        - name: repairServiceId
          in: query
          description: Termine auf eine bestimmte Dienstleistung beschränken
          required: false
          type: string
        - name: customerNumber
          in: query
          description: Termine nach Kundennummer filtern
          required: false
          type: string
      responses:
        '200':
          description: Liste der Kundentermine
          schema:
            type: array
            items:
              $ref: '#/definitions/appointment'
        '400':
          description: Ungültiger Zeitraum (from nach to oder kein ISO-8601-Datum)
          schema:
            $ref: '#/definitions/problem'
        '404':
          description: IT-Service-Anbieter nicht gefunden

    post:
      tags:
        - appointments
      summary: Neuen Kundentermin buchen
      description: >
        Bucht einen Termin für eine ausgewählte IT-Dienstleistung.
        Die Dauer wird anhand der konfigurierten Dienstleistung berechnet.
        Vor der Buchung muss die Kapazität erneut geprüft werden.
        Bei ausgeschöpfter Kapazität wird HTTP 409 zurückgegeben.
      operationId: createAppointment
      parameters:
        - $ref: '#/parameters/serviceId'
        - name: appointment
          in: body
          description: Angaben zum gewünschten Termin
          required: true
          schema:
            $ref: '#/definitions/appointmentRequest'
      responses:
        '201':
          description: Termin erfolgreich gebucht
          schema:
            $ref: '#/definitions/appointment'
        '400':
          description: Ungültige Buchungsdaten oder ungültiger Zeitraster
        '404':
          description: IT-Service-Anbieter oder Dienstleistung nicht gefunden
        '409':
          description: Termin nicht verfügbar oder Kapazität ausgeschöpft

  /it-services/{serviceId}/appointments/{appointmentId}:
    get:
      tags:
        - appointments
      summary: Details eines Kundentermins abrufen
      operationId: getAppointment
      parameters:
        - $ref: '#/parameters/serviceId'
        - name: appointmentId
          in: path
          description: Eindeutige Kennung des Termins
          required: true
          type: string
      responses:
        '200':
          description: Termindetails
          schema:
            $ref: '#/definitions/appointment'
        '404':
          description: Termin oder IT-Service-Anbieter nicht gefunden

  /it-services/{serviceId}/appointment-suggestions:
    get:
      tags:
        - appointment-suggestions
      summary: Verfügbare Termine vorschlagen
      description: >
        Liefert verfügbare Startzeiten im 15-Minuten-Raster.
        Die Dauer der gewählten Dienstleistung und die parallele
        Kapazität des Anbieters werden berücksichtigt.
        Bestehende und importierte Termine fließen in die Berechnung ein.
      operationId: getAppointmentSuggestions
      parameters:
        - $ref: '#/parameters/serviceId'
        - name: repairServiceId
          in: query
          description: Kennung der gewünschten Dienstleistung
          required: true
          type: string
        - name: from
          in: query
          description: Beginn des Suchzeitraums (ISO 8601)
          required: true
          type: string
          format: date-time
        - name: to
          in: query
          description: Ende des Suchzeitraums (ISO 8601)
          required: true
          type: string
          format: date-time
      responses:
        '200':
          description: Liste verfügbarer Terminvorschläge
          schema:
            type: array
            items:
              $ref: '#/definitions/appointmentSuggestion'
        '400':
          description: Ungültiger Suchzeitraum
        '404':
          description: IT-Service-Anbieter oder Dienstleistung nicht gefunden

  /it-services/{serviceId}/appointment-imports:
    post:
      tags:
        - appointment-imports
      summary: Bestandstermine aus CSV importieren
      description: >
        Importiert eine CSV-Datei (KdnNr,APP_DATE,SERVICE) für genau den Anbieter aus dem Pfad.
        Jede Zeile wird wie eine Buchung geprüft (Leistungscode, 15-Minuten-Raster, Kapazität).
        Gültige Zeilen werden importiert, ungültige mit Zeilennummer und Grund protokolliert.
        Bereits importierte Termine werden als Duplikat übersprungen.
      operationId: importAppointments
      consumes:
        - multipart/form-data
      parameters:
        - $ref: '#/parameters/serviceId'
        - name: file
          in: formData
          description: CSV-Datei
          required: true
          type: file
      responses:
        '201':
          description: Import durchgeführt, Bericht im Body
          headers:
            Location:
              type: string
              description: URL des Importberichts
          schema:
            $ref: '#/definitions/importReport'
        '400':
          description: Datei leer, falscher Header oder nicht lesbar
          schema:
            $ref: '#/definitions/problem'
        '404':
          description: IT-Service-Anbieter nicht gefunden
    get:
      tags:
        - appointment-imports
      summary: Importe eines Anbieters auflisten (ohne Zeilendetails)
      operationId: getImports
      parameters:
        - $ref: '#/parameters/serviceId'
      responses:
        '200':
          description: Importberichte, neueste zuerst
          schema:
            type: array
            items:
              $ref: '#/definitions/importReport'
        '404':
          description: IT-Service-Anbieter nicht gefunden

  /it-services/{serviceId}/appointment-imports/{importId}:
    get:
      tags:
        - appointment-imports
      summary: Importbericht inklusive abgelehnter Zeilen
      operationId: getImport
      parameters:
        - $ref: '#/parameters/serviceId'
        - name: importId
          in: path
          required: true
          type: string
      responses:
        '200':
          description: Importbericht
          schema:
            $ref: '#/definitions/importReport'
        '404':
          description: Import nicht gefunden

parameters:
  serviceId:
    name: serviceId
    in: path
    description: Eindeutige Kennung des IT-Service-Anbieters
    required: true
    type: string

definitions:
  itService:
    type: object
    required:
      - id
      - name
      - capacity
    properties:
      id:
        type: string
        description: Eindeutige Kennung des IT-Service-Anbieters
        example: IT-MUELLER
      name:
        type: string
        description: Name des IT-Service-Anbieters
        example: IT-Service Müller
      capacity:
        type: integer
        minimum: 1
        description: Maximale Anzahl parallel laufender Termine
        example: 2

  repairService:
    type: object
    required:
      - id
      - code
      - name
      - durationMinutes
    properties:
      id:
        type: string
        description: Eindeutige Kennung der Dienstleistung
        example: DIA
      code:
        type: string
        description: Leistungscode aus dem Altsystem
        example: DIA
      name:
        type: string
        description: Bezeichnung der Dienstleistung
        example: PC-Diagnose
      durationMinutes:
        type: integer
        minimum: 1
        description: Bearbeitungsdauer in Minuten
        example: 30

  appointment:
    type: object
    required:
      - id
      - customerNumber
      - start
      - end
      - serviceId
      - serviceName
      - repairServiceId
      - repairServiceName
    properties:
      id:
        type: string
        description: Eindeutige Kennung des Termins
        example: APPT-1001
      customerNumber:
        type: string
        description: Kundennummer aus dem Altsystem
        example: '10001'
      start:
        type: string
        format: date-time
        description: Startzeitpunkt des Termins (ISO 8601)
        example: '2026-11-02T09:00:00Z'
      end:
        type: string
        format: date-time
        description: Endzeitpunkt des Termins (ISO 8601)
        example: '2026-11-02T09:30:00Z'
      serviceId:
        type: string
        description: Kennung des IT-Service-Anbieters
        example: IT-MUELLER
      serviceName:
        type: string
        description: Name des IT-Service-Anbieters
        example: IT-Service Müller
      repairServiceId:
        type: string
        description: Kennung der gebuchten Dienstleistung
        example: DIA
      repairServiceName:
        type: string
        description: Bezeichnung der gebuchten Dienstleistung
        example: PC-Diagnose
      source:
        type: string
        enum: [BOOKED, IMPORTED]
        description: Herkunft des Termins (Erweiterung)
        example: BOOKED

  appointmentRequest:
    type: object
    required:
      - customerNumber
      - start
      - repairServiceId
    properties:
      customerNumber:
        type: string
        description: Kundennummer des Kunden
        example: '10001'
      start:
        type: string
        format: date-time
        description: Gewünschter Startzeitpunkt im 15-Minuten-Raster
        example: '2026-11-02T09:00:00Z'
      repairServiceId:
        type: string
        description: Kennung der gewünschten Dienstleistung
        example: DIA

  appointmentSuggestion:
    type: object
    required:
      - start
      - end
      - serviceId
      - repairServiceId
    properties:
      start:
        type: string
        format: date-time
        description: Vorgeschlagener Startzeitpunkt
        example: '2026-11-02T09:00:00Z'
      end:
        type: string
        format: date-time
        description: Voraussichtlicher Endzeitpunkt
        example: '2026-11-02T09:30:00Z'
      serviceId:
        type: string
        description: Kennung des IT-Service-Anbieters
        example: IT-MUELLER
      repairServiceId:
        type: string
        description: Kennung der Dienstleistung
        example: DIA

  importReport:
    type: object
    required: [id, serviceId, importedAt, totalRows, imported, duplicates, rejected]
    properties:
      id:
        type: string
        description: Kennung des Imports
      serviceId:
        type: string
        description: Kennung des IT-Service-Anbieters
        example: IT-MUELLER
      fileName:
        type: string
        example: termine.csv
      importedAt:
        type: string
        format: date-time
      totalRows:
        type: integer
        description: Anzahl Datenzeilen (ohne Header)
      imported:
        type: integer
      duplicates:
        type: integer
        description: Bereits vorhandene Termine, übersprungen
      rejected:
        type: integer
        description: Fehlerhafte Zeilen
      rejections:
        type: array
        description: Nicht importierte Zeilen (nur im Einzelabruf und direkt nach dem Import)
        items:
          $ref: '#/definitions/importRejection'

  importRejection:
    type: object
    required: [lineNumber, reason, message]
    properties:
      lineNumber:
        type: integer
        description: Zeilennummer in der Datei (Header = 1)
        example: 4
      rawLine:
        type: string
        example: 10003,2026-11-02T09:00Z,LAP
      reason:
        type: string
        enum: [MALFORMED_ROW, MISSING_FIELD, INVALID_DATE, OFF_GRID, OUTSIDE_OPENING_HOURS, UNKNOWN_SERVICE_CODE, CAPACITY_EXCEEDED, DUPLICATE]
      message:
        type: string
        example: Service code 'LAP' is not offered by CS-SCHNEIDER (offered DAT, DIA, VIR)

  problem:
    type: object
    description: Fehlerantwort nach RFC 9457 (application/problem+json) – Erweiterung
    properties:
      type:
        type: string
      title:
        type: string
        example: Appointment not available
      status:
        type: integer
        example: 409
      detail:
        type: string
        example: No capacity left for LAP at 2026-11-02T09:00:00Z
      instance:
        type: string
