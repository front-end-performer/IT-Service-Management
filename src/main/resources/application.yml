spring:
  application:
    name: appointments
  datasource:
    url: jdbc:postgresql://localhost:5432/icares
    username: icares
    password: icares
    hikari:
      # Bound the wait for the provider row lock (ADR 0003); identical semantics on H2, see application-h2.yml.
      connection-init-sql: SET lock_timeout = '${appointments.lock-timeout-ms}ms'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

appointments:
  # How long a booking/import waits for another transaction on the same provider before answering 503.
  lock-timeout-ms: 10000

server:
  address: 127.0.0.1
  port: 8080

# Provider and service catalog including opening hours. Synchronised into the database on startup;
# a new provider or service is added here without touching Java code.
catalog:
  providers:
    - id: IT-MUELLER
      name: IT-Service Müller
      capacity: 2
      # Local wall-clock times; an appointment must end by closing time. Missing days are closed.
      time-zone: Europe/Berlin
      opening-hours:
        MONDAY: 08:00-18:00
        TUESDAY: 08:00-18:00
        WEDNESDAY: 08:00-18:00
        THURSDAY: 08:00-18:00
        FRIDAY: 08:00-18:00
        SATURDAY: 09:00-13:00
      services:
        - code: DIA
          name: PC-Diagnose
          duration-minutes: 30
        - code: LAP
          name: Laptop-Service
          duration-minutes: 120
        - code: OSI
          name: Betriebssystem-Installation
          duration-minutes: 60
    - id: CS-SCHNEIDER
      name: Computer-Service Schneider
      capacity: 3
      time-zone: Europe/Berlin
      opening-hours:
        MONDAY: 08:00-17:00
        TUESDAY: 08:00-17:00
        WEDNESDAY: 08:00-17:00
        THURSDAY: 08:00-17:00
        FRIDAY: 08:00-17:00
        SATURDAY: 10:00-14:00
      services:
        - code: DIA
          name: PC-Diagnose
          duration-minutes: 15
        - code: VIR
          name: Virenentfernung
          duration-minutes: 60
        - code: DAT
          name: Datenrettung
          duration-minutes: 180
