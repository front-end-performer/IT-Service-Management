# Self-contained mode: java -jar appointments.jar --spring.profiles.active=h2
spring:
  datasource:
    url: jdbc:h2:file:./data/appointments;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    hikari:
      # H2's default lock timeout is ~2 s while PostgreSQL waits forever; use the same explicit value on both.
      connection-init-sql: SET LOCK_TIMEOUT ${appointments.lock-timeout-ms}
  h2:
    console:
      enabled: true
